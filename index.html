
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dōTERRA | Эмоциональное здоровье</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'primary': '#98c281',
              'background-light': '#f9f8f6',
              'background-dark': '#0a0a0a',
              'forest': '#122111',
              'sage': '#3a4d39',
              'beige-soft': '#f3ede6',
              'wood': '#5a5043',
            },
            keyframes: {
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-5px)' },
                '50%': { transform: 'translateX(5px)' },
                '75%': { transform: 'translateX(-5px)' },
              },
              breathDot: {
                '0%, 100%': { transform: 'scale(1)', opacity: '0.6' },
                '50%': { transform: 'scale(1.35)', opacity: '1' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '0.35' },
                '50%': { opacity: '0.85' },
              },
              riseFade: {
                '0%': { transform: 'translateY(0)', opacity: '1' },
                '100%': { transform: 'translateY(-120px)', opacity: '0' },
              },
              oilDrop: {
                '0%': { transform: 'translateY(-8px)', opacity: '0.9' },
                '50%': { transform: 'translateY(0)', opacity: '1' },
                '100%': { transform: 'translateY(-8px)', opacity: '0.9' },
              },
            },
            animation: {
              shake: 'shake 0.3s ease-in-out',
              'breath-dot': 'breathDot 2s ease-in-out infinite',
              'pulse-slow': 'pulseSlow 3s ease-in-out infinite',
              'rise-fade': 'riseFade 1.2s ease-in forwards',
              'oil-drop': 'oilDrop 3s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Manrope', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
      @keyframes gradient-shimmer {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .animate-gradient-shimmer {
        background-size: 200% auto;
        animation: gradient-shimmer 4s ease infinite;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .practice-letter {
        will-change: transform, opacity, filter;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
